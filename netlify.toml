# Netlify hosts the static frontend only. The FastAPI backend (PostgreSQL, the
# encrypted users vault, the activity log) runs on its own server; set its public
# URL as BACKEND_URL in Netlify: Site configuration > Environment variables.

[build]
  base = "frontend"
  command = "npm run build && node scripts/netlify-redirects.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Single-page app: any path that isn't a file (/manual, /cont, ...) serves index.html,
# so React Router can handle it. The /api proxy rule is written to dist/_redirects at
# build time and Netlify applies _redirects before these rules.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
